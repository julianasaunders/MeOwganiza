name: Build Desktop (Windows + Linux)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the build assets (optional)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executables
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pywebview>=6.0" pyinstaller

      - name: Build GUI and CLI
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --noconsole --name MeOwganiza --icon assets/gato-icon.ico --add-data "ui;ui" --paths src --hidden-import meowganiza --hidden-import meowganiza.native --collect-submodules meowganiza entry_gui.py
          python -m PyInstaller --noconfirm --onefile --name MeOwganizaCLI --icon assets/gato-icon.ico --add-data "ui;ui" --paths src --hidden-import meowganiza --hidden-import meowganiza.cli --collect-submodules meowganiza entry_cli.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: meowganiza-windows
          path: |
            dist/MeOwganiza.exe
            dist/MeOwganizaCLI.exe
          retention-days: 30

  build-linux:
    name: Build Linux executables
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pywebview[qt]>=6.0" pyinstaller

      - name: Build GUI and CLI
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name MeOwganiza --icon assets/gato-icon.png --add-data "ui:ui" --paths src --hidden-import meowganiza --hidden-import meowganiza.native --collect-submodules meowganiza --collect-all webview --collect-all PyQt6 entry_gui.py
          chmod +x dist/MeOwganiza
          mkdir -p dist/linux-package
          cp dist/MeOwganiza dist/linux-package/MeOwganiza
          tar -czf dist/MeOwganiza-linux-x86_64.tar.gz -C dist/linux-package .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: meowganiza-linux
          path: dist/MeOwganiza-linux-x86_64.tar.gz
          retention-days: 30

  publish-release-assets:
    name: Attach installers to release
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: |
            release-assets/meowganiza-windows/MeOwganiza.exe
            release-assets/meowganiza-windows/MeOwganizaCLI.exe
            release-assets/meowganiza-linux/MeOwganiza-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
