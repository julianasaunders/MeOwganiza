<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeOwganiza — demonstração animada</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0e1b21;
    color: #e6f1f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .spacer { height: 65vh; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 48px; text-align: center; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); margin: 0 0 12px; }
  p { color: #9fb8bd; margin: 0 auto 28px; max-width: 700px; }
  .status {
    display: inline-block;
    margin-bottom: 16px;
    padding: 6px 14px;
    border-radius: 999px;
    background: #173039;
    color: #9fb8bd;
    font-size: 14px;
  }
  .status[data-on="true"] { background: #1d4d3f; color: #8ef0bd; }
  img {
    display: block;
    width: 100%;
    max-width: 1135px;
    margin: 0 auto;
    border-radius: 12px;
    box-shadow: 0 18px 60px rgba(0,0,0,.45);
  }
  a { color: #7fd7c4; }
  footer { margin-top: 32px; font-size: 14px; color: #9fb8bd; }
</style>
</head>
<body>
<div class="spacer"></div>

<main class="wrap">
  <h1>MeOwganiza — demonstração animada</h1>
  <p>A animação só começa quando o vídeo estiver no centro da tela. Ao sair do centro, ela para no primeiro quadro e recomeça do zero quando você volta.</p>

  <div class="status" id="status" data-on="false">⏸ Aguardando centralização</div>

  <img
    id="demo"
    src="docs/images/demo-still.png"
    alt="Demonstração do MeOwganiza: seleção da pasta, prévia e organização dos arquivos"
    width="1135"
    height="726">

  <footer>
    <a href="index.html">← Voltar para a página do projeto</a>
    ·
    <a href="https://github.com/julianasaunders/MeOwganiza">Código no GitHub</a>
  </footer>
</main>

<div class="spacer"></div>

<script>
(function () {
  const img = document.getElementById('demo');
  const status = document.getElementById('status');
  const still = 'docs/images/demo-still.png';
  const gif = 'docs/images/demo-v2.gif';
  let ativo = false;

  const observer = new IntersectionObserver(function (entries) {
    const centralizado = entries[0].isIntersecting;

    if (centralizado && !ativo) {
      ativo = true;
      // Parâmetro único força o navegador a buscar o GIF do início.
      img.src = gif + '?t=' + Date.now();
      status.textContent = '▶ Animando';
      status.dataset.on = 'true';
    } else if (!centralizado && ativo) {
      ativo = false;
      img.src = still;
      status.textContent = '⏸ Aguardando centralização';
      status.dataset.on = 'false';
    }
  }, {
    root: null,
    rootMargin: '-40% 0px -40% 0px',
    threshold: 0
  });

  observer.observe(img);
})();
</script>
</body>
</html>
