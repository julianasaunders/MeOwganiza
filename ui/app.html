      idea: 'Estrelas desde a escolha da pasta, análise em palco limpo, mapa em aglomerados, prévia com gaveta e a Celebração no final.',
      winsWhen: 'Você quer ver o fluxo inteiro com as peças escolhidas.',
      cost: 'Dados fictícios: 340 arquivos iguais para qualquer pasta.',
      views: { pick: CHOSEN_PICK.pick, map: CHOSEN_PICK.map, scan: viewA, done: () => (state.undone ? undoneView() : finalC()) },
      mountHead(step) {
        if (step === 'pick') wireFolderPick();
        if (step === 'pick') fitCats();
        if (step === 'pick' || step === 'scan') placeSky('mess', true);
        if (step === 'map') placeSky('type', true);
      },
    });
    const baseMount = flow.mount;
    flow.mount = (step) => { if (step === 'done') finalMount(); else baseMount(step); };
    return flow;
  })(),
];

const INFO_FIELDS = [['problem', 'Problema'], ['idea', 'Proposta'], ['winsWhen', 'Ganha quando'], ['cost', 'Custo']];
const SLOW_MOTION_FACTOR = 5;
const KEY_ACTIONS = { r: 'replay', i: 'info', t: 'theme', s: 'slow', h: 'hide', p: 'position' };
const ACTIONS = { replay: mountVariant, info: toggleInfo, theme: toggleTheme, slow: toggleSlowMotion, hide: toggleHidden, position: togglePosition };

const root = document.documentElement;
const stage = document.getElementById('pv-stage');
const dock = document.getElementById('pv-dock');
let current = 0;

renderDock();
const card = dock.querySelector('.pv-card');
const highlight = dock.querySelector('.pv-highlight');
const variantButtons = [...dock.querySelectorAll('[data-variant]')];

dock.addEventListener('click', handleDockClick);
dock.addEventListener('pointerenter', () => dock.removeAttribute('data-dim'));
stage.addEventListener('pointerenter', () => dock.setAttribute('data-dim', ''));
document.addEventListener('keydown', handleKey);
window.addEventListener('resize', moveHighlight);
window.addEventListener('focus', renderKeyHint);
window.addEventListener('blur', renderKeyHint);

selectVariant(initialIndex());
finishEntranceAnimations();
requestAnimationFrame(() => requestAnimationFrame(() => dock.setAttribute('data-ready', '')));

function renderDock() {
  dock.dataset.position = OPTIONS.position;
  dock.innerHTML = `
    <section class="pv-card pv-glass" aria-live="polite"></section>
    <nav class="pv-bar pv-glass" aria-label="Variações">
      <span class="pv-highlight" aria-hidden="true"></span>
      ${VARIANTS.map(variantButton).join('')}
      <span class="pv-divider" aria-hidden="true"></span>
      ${actionButton('replay', '↻', 'Repetir animação (R)')}
      ${actionButton('info', 'i', 'Descrição (I)', false)}
      ${OPTIONS.theme ? actionButton('theme', '◐', 'Tema claro ou escuro (T)', false) : ''}
      ${OPTIONS.slowMotion ? actionButton('slow', '×5', 'Câmera lenta (S)', false) : ''}
      ${actionButton('position', '⇅', 'Mover para o outro lado (P)')}
      ${actionButton('hide', '⌄', 'Esconder controles (H)')}
    </nav>
    <button class="pv-handle" data-action="hide" title="Mostrar controles (H)" aria-label="Mostrar controles (H)"></button>`;
}

function variantButton(variant, index) {
  return `<button class="pv-btn" data-variant="${index}" aria-label="Variação ${index + 1}: ${variant.name}">
    <span class="pv-n">${index + 1}</span><span class="pv-name">${variant.name}</span>
  </button>`;
}

function actionButton(action, glyph, label, pressed) {
  const pressedAttr = pressed === undefined ? '' : `aria-pressed="${pressed}"`;
  return `<button class="pv-btn pv-icon" data-action="${action}" title="${label}" aria-label="${label}" ${pressedAttr}>${glyph}</button>`;
}

function selectVariant(index) {
  if (index < 0 || index >= VARIANTS.length) return;
  current = index;
  mountVariant();
  renderInfo();
  updateVariantButtons();
  moveHighlight();
  persistSelection();
}

function mountVariant() {
  stage.innerHTML = VARIANTS[current].render();
}

function renderInfo() {
  const variant = VARIANTS[current];
  const fields = INFO_FIELDS.filter(([key]) => variant[key])
    .map(([key, label]) => `<dt>${label}</dt><dd>${variant[key]}</dd>`).join('');
  card.innerHTML = `
    <div class="pv-card-head">
      <span class="pv-number">${current + 1}</span>
      <div><div class="pv-title">${variant.name}</div><span class="pv-axis">${variant.axis}</span></div>
      <span class="pv-count">${current + 1} de ${VARIANTS.length}</span>
    </div>
    <dl class="pv-fields">${fields}</dl>
    <div class="pv-keys"></div>`;
  renderKeyHint();
  dock.querySelector('.pv-handle').textContent = current + 1;
  document.title = `${current + 1} · ${variant.name} · ${PREVIEW_TITLE}`;
}

function renderKeyHint() {
  const keys = card.querySelector('.pv-keys');
  if (!document.hasFocus()) {
    keys.textContent = 'Clique na página para usar os atalhos do teclado';
    return;
  }
  const optional = [OPTIONS.theme && '<kbd>T</kbd> tema', OPTIONS.slowMotion && '<kbd>S</kbd> lento'].filter(Boolean);
  keys.innerHTML = [`<kbd>1</kbd> a <kbd>${VARIANTS.length}</kbd> ou <kbd>←</kbd> <kbd>→</kbd> trocar`,
    '<kbd>R</kbd> repetir', '<kbd>I</kbd> descrição', ...optional, '<kbd>P</kbd> posição', '<kbd>H</kbd> esconder'].join(' &nbsp; ');
}

function updateVariantButtons() {
  variantButtons.forEach((button, index) => {
    if (index === current) button.setAttribute('aria-current', 'true');
    else button.removeAttribute('aria-current');
  });
}

function moveHighlight() {
  const button = variantButtons[current];
  highlight.style.width = `${button.offsetWidth}px`;
  highlight.style.transform = `translateX(${button.offsetLeft}px)`;
  button.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function persistSelection() {
  const url = new URL(location.href);
  url.searchParams.set('v', current + 1);
  try { history.replaceState(null, '', url); } catch {} // file:// tem origem opaca e o Chrome recusa replaceState
}

function initialIndex() {
  return (parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1;
}

// Página aberta em segundo plano não desenha frames: a entrada congelaria no início, com o conteúdo apagado.
function finishEntranceAnimations() {
  stage.getAnimations({ subtree: true })
    .filter((animation) => animation.effect.getComputedTiming().endTime !== Infinity)
    .forEach((animation) => animation.finish());
}

function handleDockClick(event) {
  const clickedVariant = event.target.closest('[data-variant]');
  if (clickedVariant) return selectVariant(Number(clickedVariant.dataset.variant));
  runAction(event.target.closest('[data-action]')?.dataset.action);
}

function handleKey(event) {
  if (isTyping(event.target) || event.metaKey || event.ctrlKey || event.altKey) return;
  dock.removeAttribute('data-dim');
  const number = Number(event.key);
  if (number >= 1 && number <= VARIANTS.length) return selectVariant(number - 1);
  if (event.key === 'ArrowRight') return selectVariant((current + 1) % VARIANTS.length);
  if (event.key === 'ArrowLeft') return selectVariant((current - 1 + VARIANTS.length) % VARIANTS.length);
  runAction(KEY_ACTIONS[event.key.toLowerCase()]);
}

function isTyping(target) {
  return /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName) || target.isContentEditable;
}

function runAction(action) {
  if (!action || !dock.querySelector(`[data-action="${action}"]`)) return;
  ACTIONS[action]();
}

function toggleInfo() {
  if (dock.dataset.view === 'hidden') toggleHidden();
  const isOn = dock.dataset.info === 'on';
  dock.dataset.info = isOn ? 'off' : 'on';
  setPressed('info', !isOn);
}

function toggleHidden() {
  dock.dataset.view = dock.dataset.view === 'hidden' ? 'full' : 'hidden';
  dock.removeAttribute('data-dim');
}

function togglePosition() {
  dock.dataset.position = dock.dataset.position === 'top' ? 'bottom' : 'top';
}

function toggleTheme() {
  const isDark = root.dataset.theme === 'dark';
  root.dataset.theme = isDark ? 'light' : 'dark'; // PREENCHER: usar a classe ou atributo de tema do projeto
  setPressed('theme', !isDark);
}

function toggleSlowMotion() {
  const isSlow = root.style.getPropertyValue('--slow') === String(SLOW_MOTION_FACTOR);
  root.style.setProperty('--slow', isSlow ? 1 : SLOW_MOTION_FACTOR);
  setPressed('slow', !isSlow);
  mountVariant();
}

function setPressed(action, pressed) {
  dock.querySelector(`[data-action="${action}"]`).setAttribute('aria-pressed', String(pressed));
}
</script>
<script>
stage.addEventListener('click', (event) => {
  for (const [key, handler] of Object.entries(CLICK_HANDLERS)) {
    const target = event.target.closest(`[data-${key}]`);
    if (target) return handler(target);
  }
});
</script>
<script src="./app.js"></script>
</body>
</html>
