<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeOwganiza</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
  :root { --slow: 1; --ease: cubic-bezier(.23, 1, .32, 1); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; background: #1b1b1f; color: #fff; -webkit-font-smoothing: antialiased; }
  #pv-stage { min-height: 100vh; padding: 72px 24px 48px; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .enter { animation: enter calc(320ms * var(--slow)) var(--ease) both; }
  .rise { animation: enter calc(360ms * var(--slow)) var(--ease) both; animation-delay: calc(var(--d, 0) * 50ms * var(--slow)); }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } }
  @media (prefers-reduced-motion: reduce) { .enter, .rise, .pop { animation: none; } }

  .win { position: relative; width: min(1120px, 100%); height: 680px; margin: 0 auto; border-radius: 14px; overflow: hidden; display: grid; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 40px 80px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.3); }
  .tile { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(145deg, var(--a), var(--b)); color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--b) 45%, transparent), inset 0 1px 0 rgba(255,255,255,.35); flex: none; }
  .tile .i { width: 22px; height: 22px; }
  .muted { color: rgba(255,255,255,.62); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 12px; font-weight: 500; }
  .cta { height: 44px; padding: 0 24px; border-radius: 999px; background: #fff; color: #1d1236; font-weight: 600; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform 160ms var(--ease), box-shadow 160ms var(--ease); }
  .cta:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(0,0,0,.3); }
  .cta:active { transform: scale(.97); }
  .ghost { height: 44px; padding: 0 20px; border-radius: 999px; background: rgba(255,255,255,.12); font-weight: 500; transition: background 160ms ease-out, transform 160ms var(--ease); }
  .ghost:hover { background: rgba(255,255,255,.2); } .ghost:active { transform: scale(.97); }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }


  /* ===== Rodada 2: fluxo completo ===== */
  .r2 { --fg:#fff; --mute:rgba(255,255,255,.62); --line:rgba(255,255,255,.16); --panel:rgba(255,255,255,.08); --accent:#fff; --on-accent:#1d1236; --solid:#1d1236; --on:#34c759; color: var(--fg); display: block; }
  .r2 .cta { background: var(--accent); color: var(--on-accent); }
  .r2 .ghost { background: var(--panel); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  .r2 .ghost:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
  .r2 .cta[disabled] { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .r2 .muted { color: var(--mute); }
  .r2-col { position: absolute; inset: 0; }
  .v1r { display: grid; grid-template-columns: 232px 1fr; } .v1r .r2-col { position: relative; min-width: 0; }
  .r2-top { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; z-index: 2; pointer-events: none; }
  .r2-flow { position: absolute; inset: 0; padding-top: 56px; display: flex; flex-direction: column; overflow: hidden; }
  .stepper { display: flex; align-items: center; gap: 8px; list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .stepper li { display: flex; align-items: center; gap: 8px; color: var(--mute); transition: color 240ms ease-out; }
  .stepper li:not(:last-child)::after { content: ""; width: 24px; height: 2px; border-radius: 2px; background: var(--line); }
  .stepper .dot { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--line); color: var(--fg); font-size: 12px; font-weight: 600; transition: background 240ms ease-out, color 240ms ease-out; }
  .stepper .dot .i { width: 12px; height: 12px; stroke-width: 3; }
  .stepper li[data-state="done"] .dot { background: var(--accent); color: var(--on-accent); }
  .stepper li[aria-current="step"] { color: var(--fg); } .stepper li[aria-current="step"] .dot { background: var(--fg); color: var(--solid); }
  .title { margin: 0 0 8px; font-size: 32px; letter-spacing: -.02em; line-height: 1.15; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .note { margin: 0; font-size: 13px; }

  .pick { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; padding: 0 32px 40px; }
  .pick p { margin: 0; max-width: 460px; line-height: 1.5; }
  .folders { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; width: min(820px, 100%); }
  .fcard { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 18px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); text-align: left; transition: background 160ms ease-out, transform 180ms var(--ease), box-shadow 160ms ease-out; }
  .fcard:hover { transform: translateY(-2px); } .fcard:active { transform: scale(.98); }
  .fcard b { font-size: 15px; display: block; } .fcard span { font-size: 12px; color: var(--mute); }
  .fcard[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--fg); background: color-mix(in srgb, var(--fg) 12%, transparent); }
  .fcard.drop { box-shadow: inset 0 0 0 1.5px var(--line); border: 1.5px dashed var(--line); background: transparent; justify-content: center; }

  .feed { margin: auto; width: min(640px, 100%); display: grid; gap: 22px; padding: 0 24px 48px; }
  .bignum { font-size: 76px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .track { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; } .track i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent2, var(--accent))); }
  .filenow { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .live div { padding: 14px 16px; border-radius: 16px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); text-align: left; }
  .live b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; } .live span { font-size: 13px; color: var(--mute); }
  .ringwrap { margin: auto; display: grid; justify-items: center; gap: 20px; padding: 0 24px 40px; text-align: center; }
  .ring { position: relative; width: 248px; height: 248px; } .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; stroke-linecap: round; } .ring .t { stroke: var(--line); } .ring .p { stroke: var(--fg); stroke-dasharray: 691; stroke-dashoffset: 691; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--fg) 60%, transparent)); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ring .num small { display: block; font-size: 13px; font-weight: 500; color: var(--mute); }
  .ring::before { content: ""; position: absolute; inset: 22px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.25), rgba(255,255,255,.04)); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); animation: breathe calc(2400ms * var(--slow)) ease-in-out infinite; }
  @keyframes breathe { 50% { scale: 1.04; } }

  .apply { margin: auto; width: min(560px, 100%); display: grid; gap: 20px; padding: 0 24px 40px; }
  .tasks { display: grid; gap: 8px; }
  .task { display: grid; grid-template-columns: 36px 1fr 24px; gap: 4px 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); opacity: .5; transition: opacity 240ms ease-out; }
  .task[data-state="run"], .task[data-state="done"] { opacity: 1; }
  .task .tile { grid-row: span 2; width: 36px; height: 36px; border-radius: 10px; } .task .tile .i { width: 18px; height: 18px; }
  .task b { font-size: 14px; font-weight: 500; } .task .mini { grid-column: 2 / 3; height: 4px; border-radius: 9px; background: var(--line); overflow: hidden; } .task .mini i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; }
  .task .tick { grid-row: span 2; grid-column: 3; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--on); color: #fff; scale: 0; transition: scale 280ms var(--ease); } .task .tick .i { width: 12px; height: 12px; stroke-width: 3; }
  .task[data-state="done"] .tick { scale: 1; }

  .done2 { margin: auto; display: grid; justify-items: center; gap: 22px; text-align: center; padding: 0 24px 40px; }
  .badge { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 30px; background: linear-gradient(145deg, var(--a1, #6ee7a0), var(--b1, #16a34a)); color: #fff; box-shadow: 0 20px 40px color-mix(in srgb, var(--b1, #16a34a) 45%, transparent), inset 0 1px 0 rgba(255,255,255,.45); animation: pop-in calc(480ms * var(--slow)) var(--ease) both; }
  .badge .i { width: 44px; height: 44px; stroke-width: 2.6; } .badge path { stroke-dasharray: 40; animation: draw calc(600ms * var(--slow)) var(--ease) calc(200ms * var(--slow)) both; }
  @keyframes draw { from { stroke-dashoffset: 40; } } @keyframes pop-in { from { opacity: 0; scale: .4; } }
  .bigres { font-size: 68px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .res-stats { display: flex; gap: 32px; } .res-stats div { text-align: center; } .res-stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; } .res-stats span { font-size: 13px; color: var(--mute); }

  .opts { display: grid; gap: 8px; }
  .opt { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px; border-radius: 14px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); text-align: left; transition: background 160ms ease-out, transform 160ms var(--ease); }
  .opt:hover { background: color-mix(in srgb, var(--fg) 12%, transparent); } .opt:active { transform: scale(.985); }
  .opt .tile { width: 36px; height: 36px; border-radius: 10px; } .opt .tile .i { width: 18px; height: 18px; }
  .opt .txt { flex: 1; min-width: 0; } .opt .txt b { display: block; font-size: 14px; font-weight: 600; } .opt .txt span { font-size: 12px; color: var(--mute); }
  .sw { position: relative; flex: none; width: 40px; height: 24px; border-radius: 99px; background: var(--line); transition: background 200ms ease-out; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform 240ms var(--ease); }
  [aria-pressed="true"] > .sw { background: var(--on); } [aria-pressed="true"] > .sw::after { transform: translateX(16px); }
  .sumline { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 2px; font-size: 13px; color: var(--mute); } .sumline b { font-size: 20px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .seg button { height: 30px; padding: 0 16px; border-radius: 999px; font-size: 13px; color: var(--mute); transition: background 180ms ease-out, color 180ms ease-out; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--solid); font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--mute); transition: background 160ms ease-out, color 160ms ease-out; }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--solid); }
  .hatch { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.4) 0 3px, transparent 3px 7px); }
  .crumbs2 { display: flex; align-items: center; gap: 8px; font-size: 14px; } .crumbs2 button { color: var(--mute); } .crumbs2 button:hover { color: var(--fg); } .crumbs2 b { font-weight: 600; }

  /* 1 · Bolhas */
  .v1r { background: radial-gradient(120% 90% at 85% 0%, #e24aa8 0%, transparent 55%), linear-gradient(150deg, #2a1170 0%, #5a1fa8 55%, #a2279b 100%); --solid: #3a1590; }
  .side { padding: 56px 12px 16px; background: rgba(255,255,255,.07); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; gap: 2px; }
  .side h6 { margin: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.45); }
  .nav { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 10px; color: rgba(255,255,255,.75); font-size: 14px; text-align: left; transition: background 150ms ease-out; }
  .nav:hover { background: rgba(255,255,255,.08); } .nav[aria-current] { background: rgba(255,255,255,.18); color: #fff; font-weight: 600; }
  .v1m { display: grid; grid-template-columns: 1fr 300px; gap: 20px; padding: 0 24px 24px 28px; flex: 1; min-height: 0; }
  .v1m-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .bubbles-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
  .bubbles { position: relative; height: 100%; aspect-ratio: 1; max-width: 100%; }
  .bub { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; border-radius: 50%; }
  .bub-in { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; height: 100%; border-radius: 50%; text-align: center; overflow: hidden; background: radial-gradient(circle at 30% 25%, var(--a), var(--b)); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 14px 30px color-mix(in srgb, var(--b) 45%, transparent); animation: float calc(7s * var(--slow)) ease-in-out calc(var(--d) * -.9s) infinite, pop-in calc(460ms * var(--slow)) var(--ease) calc(var(--d) * 45ms * var(--slow)) both; transition: filter 160ms ease-out; }
  .bub:hover .bub-in { filter: brightness(1.15) saturate(1.1); } .bub:active .bub-in { filter: brightness(.95); }
  @keyframes float { 50% { translate: 0 -5px; } }
  .bub b { font-size: 14px; line-height: 1.1; padding: 0 6px; } .bub span { font-size: 11px; opacity: .85; font-variant-numeric: tabular-nums; } .bub .i { width: 22px; height: 22px; }
  .bub.dup .bub-in { box-shadow: inset 0 0 0 3px rgba(255,255,255,.85), 0 14px 30px rgba(0,0,0,.3); } .bub.dup .bub-in::after { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 4px, transparent 4px 9px); }
  .bub.cor .bub-in { background: radial-gradient(circle at 30% 25%, #ff8a8a, #c42a2a); box-shadow: inset 0 0 0 3px rgba(255,255,255,.9), 0 0 24px rgba(255,80,80,.6); }
  .bub { position: absolute; } .bub.static { cursor: default; }
  .v1m-side { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 22px; background: rgba(255,255,255,.1); backdrop-filter: blur(24px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); align-self: stretch; }
  .v1m-side h3 { margin: 0; font-size: 17px; } .v1m-side .cta { margin-top: auto; width: 100%; }
  .preview1 { display: grid; grid-template-columns: 260px 1fr; gap: 28px; padding: 8px 28px 28px; flex: 1; min-height: 0; align-items: center; }
  .preview1 .lead { display: grid; gap: 20px; } .preview1 .lead .big { font-size: 64px; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; align-content: center; }
  .dcard { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 18px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); } .dcard b { display: block; font-size: 14px; line-height: 1.25; } .dcard span { font-size: 12px; color: var(--mute); }
  .dcard.trash { background: rgba(255,90,90,.16); box-shadow: inset 0 0 0 1px rgba(255,140,140,.4); }

  /* 2 · Treemap */
  .v2r { background: radial-gradient(60% 50% at 8% 0%, rgba(91,140,255,.35), transparent 70%), radial-gradient(50% 50% at 100% 100%, rgba(255,122,182,.22), transparent 70%), #0e1124; --solid: #0e1124; }
  .v2m { display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 0 24px 24px; flex: 1; min-height: 0; }
  .v2m-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; } .v2m-main .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tmap { position: relative; flex: 1; min-height: 0; border-radius: 16px; overflow: hidden; }
  .tm { position: absolute; padding: 12px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; background: linear-gradient(145deg, var(--a), var(--b)); border: 2px solid #0e1124; border-radius: 10px; transition: opacity 240ms ease-out, filter 160ms ease-out; }
  .tm:hover { filter: brightness(1.12); } .tm b { font-size: 14px; } .tm span { font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
  .tm .flags { display: flex; gap: 6px; flex-wrap: wrap; } .tm .flag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 99px; background: rgba(0,0,0,.35); font-size: 11px; }
  .tm .strip { position: absolute; left: 0; right: 0; bottom: 0; opacity: .55; pointer-events: none; }
  .tm[data-dim] { opacity: .22; } .tm.dup { background: linear-gradient(145deg, var(--a), var(--b)); } .tm.dup::after { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.3) 0 4px, transparent 4px 9px); } .tm.cor { background: linear-gradient(145deg, #ff8a8a, #c42a2a); }
  .v2m-side { display: flex; flex-direction: column; gap: 12px; } .v2m-side h3 { margin: 0; font-size: 17px; } .v2m-side .cta { margin-top: auto; }
  .cmp { display: grid; grid-template-columns: 1fr 48px 1fr; gap: 12px; padding: 0 28px 24px; flex: 1; min-height: 0; align-items: stretch; }
  .tree { display: flex; flex-direction: column; gap: 2px; padding: 16px; border-radius: 18px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; overflow: hidden; }
  .tree h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .tl { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 8px; white-space: nowrap; animation: enter calc(300ms * var(--slow)) var(--ease) calc(var(--d) * 30ms * var(--slow)) both; } .tl .i { width: 16px; height: 16px; } .tl em { margin-left: auto; font-style: normal; color: var(--mute); font-variant-numeric: tabular-nums; }
  .tl.in { width: calc(100% - 18px); margin-left: 18px; color: var(--mute); } .tl.rm { background: rgba(255,90,90,.15); color: #ffb3b3; } .tl.new { background: rgba(52,199,89,.14); }
  .cmp .mid { display: grid; place-items: center; color: var(--mute); } .cmp .mid .i { width: 28px; height: 28px; animation: nudge calc(1600ms * var(--slow)) ease-in-out infinite; } @keyframes nudge { 50% { translate: 5px 0; } }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px 24px; }

  /* 3 · Sunburst claro */
  .v3r { background: #f4f2ee; --fg:#1c1b22; --mute:#6b6876; --line:rgba(0,0,0,.1); --panel:#fff; --accent:#2f6bff; --on-accent:#fff; --solid:#fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 40px 80px rgba(0,0,0,.35); }
  .v3r .ghost { box-shadow: 0 0 0 1px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06); } .v3r .cta { box-shadow: 0 6px 16px rgba(47,107,255,.35); } .v3r .opt, .v3r .live div, .v3r .task, .v3r .fcard, .v3r .dcard { box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.05); }
  .v3r .seg { background: #e7e3dc; box-shadow: none; } .v3r .seg button[aria-pressed="true"] { background: #fff; color: #1c1b22; box-shadow: 0 1px 2px rgba(0,0,0,.14); } .v3r .ring::before { display: none; }
  .v3r .track i { background: #2f6bff; } .v3r .task .mini i { background: #2f6bff; } .v3r .ring .p { stroke: #2f6bff; filter: none; }
  .v3m { display: flex; flex-direction: column; gap: 16px; padding: 0 32px 24px; flex: 1; min-height: 0; } .v3m .tabs { align-self: center; }
  .v3body { display: grid; grid-template-columns: 1fr 320px; gap: 24px; flex: 1; min-height: 0; align-items: center; }

  .queue { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 22px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px var(--line); min-height: 0; } .qbody { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 8px; align-content: start; }
  .queue h4 { margin: 6px 0 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); display: flex; justify-content: space-between; } .queue h4 em { font-style: normal; color: var(--fg); }
  .pair { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.06); font-size: 13px; transition: opacity 200ms ease-out; } .pair > div { grid-column: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .pair .ghost { grid-column: 2; grid-row: 1 / span 2; } .pair.kept { opacity: .55; }
  .tag { display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 99px; background: rgba(110,231,160,.18); color: #8be8b3; font-size: 11px; } .tag.dupt { background: rgba(196,163,255,.2); color: #d7c2ff; } .tag.cort { background: rgba(255,90,90,.2); color: #ffb3b3; }
  .r2 .ghost.sm { height: 32px; padding: 0 14px; font-size: 13px; } .ghost[disabled] { opacity: .4; cursor: not-allowed; }
  .sankwrap { flex: 1; min-height: 0; display: grid; place-items: center; } .sankey { width: 100%; height: 100%; } .sankey text { fill: #fff; font-size: 13px; }
  .rb { opacity: .55; animation: wipe calc(900ms * var(--slow)) var(--ease) calc(var(--d) * 70ms * var(--slow)) both; } @keyframes wipe { from { clip-path: inset(0 100% 0 0); } }

  /* telas finais */
  .done2 { position: relative; }
  .badge.small { width: 56px; height: 56px; border-radius: 18px; flex: none; } .badge.small .i { width: 26px; height: 26px; }
  .donebar { display: flex; align-items: center; gap: 20px; margin: 0 24px 12px; padding: 14px 18px; border-radius: 22px; background: rgba(255,255,255,.07); backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px var(--line); flex-wrap: wrap; } .donebar .res-stats { gap: 24px; }
  .receipt { width: min(460px, 100%); padding: 20px; border-radius: 22px; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px var(--line), 0 30px 60px rgba(0,0,0,.35); display: grid; gap: 8px; text-align: left; }
  .rhead { display: flex; gap: 12px; align-items: center; padding-bottom: 10px; border-bottom: 1px dashed var(--line); } .rhead b { display: block; font-size: 17px; } .rhead span { font-size: 13px; color: var(--mute); }
  .rl { display: flex; gap: 10px; align-items: center; font-size: 14px; } .rl .i { width: 16px; height: 16px; color: var(--on); stroke-width: 3; }
  .rtotal { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px dashed var(--line); } .rtotal b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .confetti { position: absolute; left: 50%; top: 34%; pointer-events: none; } .confetti i { position: absolute; width: 8px; height: 8px; border-radius: 2px; background: var(--c); animation: burst calc(1400ms * var(--slow)) var(--ease) calc(var(--d) * 60ms * var(--slow)) both; }
  @keyframes burst { from { opacity: 1; transform: translate(0, 0) scale(.4); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(260deg) scale(1); } }
  .gauge .p { transition: stroke-dashoffset calc(1400ms * var(--slow)) var(--ease); }
  .hero5 { position: absolute; left: 0; right: 0; top: 0; text-align: center; z-index: 2; display: grid; gap: 2px; pointer-events: none; }
  @media (max-width: 900px) { .m4 { grid-template-columns: 1fr; } .folders.big { grid-template-columns: 1fr 1fr; } .opts4 .opts { grid-template-columns: 1fr 1fr; } .giant { font-size: 40px; } }


  /* ===== Rodada 4: prévia + organização ===== */
  button.tl { width: 100%; text-align: left; color: inherit; cursor: pointer; transition: background 140ms ease-out, opacity 240ms ease-out; }
  .focuslist .row:hover, .focuslist .row.on { background: rgba(255,255,255,.14); }
  .tl.pending { opacity: .4; } .tl.done::after { content: "✓"; margin-left: 10px; color: #6ee7a0; font-weight: 700; }
  .tl.new { background: rgba(52,199,89,.14); } .tl.rm { background: rgba(255,90,90,.15); color: #ffb3b3; }
  .a-split { display: grid; grid-template-columns: 380px 1fr; gap: 16px; flex: 1; min-height: 0; }
  .a-split .tree { overflow: hidden; } .a-sky { display: flex; min-height: 0; } .a-sky .sky { flex: 1; margin: 0; }
  .sky.nofx .stile, .sky.nofx[data-phase="after"] .stile, .sky.nofx[data-phase="after"] .stile.trash { border-color: transparent; background: none; }
  .sky.center .stile { text-align: center; } .sky.center .stile .tl2 b { font-size: 14px; }
  .stile.done .tl2 b::after { content: " ✓"; color: #6ee7a0; }
  .sky.rows .stile { display: flex; align-items: center; padding: 0 14px; }
  .sky.rows .tl2 { width: 226px; flex: none; text-align: left; }
  .sky.rows[data-skymode="mess"] .stile { align-items: flex-start; padding-top: 10px; }
  .stile.done { border-color: rgba(110,231,160,.5); }
  .cwrap { position: relative; flex: 1; display: flex; gap: 12px; min-height: 0; }
  .cwrap .sky { margin: 0; flex: 1; min-width: 0; }
  .drawer { flex: none; width: 0; overflow: hidden; transition: width calc(420ms * var(--slow)) var(--ease); } .drawer.open { width: 380px; } .drawer .tree { width: 380px; height: 100%; box-sizing: border-box; }
  .ticker { position: absolute; left: 4px; bottom: 4px; display: grid; gap: 4px; font: 12px ui-monospace, Menlo, monospace; color: #e8e4ee; background: rgba(23,20,28,.82); backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); pointer-events: none; z-index: 3; } .ticker:empty { display: none; } .ticker div { animation: enter calc(300ms * var(--slow)) var(--ease) both; }
  .tree h4 { margin: 0 0 8px; }


  /* ===== Rodada 5: etapas antes da prévia ===== */
  .thumb.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
  .cwrap .queue { width: 380px; flex: none; overflow: hidden; }


  /* ===== Rodada 6: análise ===== */
  .scan6 { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 0 24px 20px; }
  .s6-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; } .s6-file { max-width: 420px; text-align: right; padding-bottom: 8px; }
  .s6-stage { position: relative; flex: 1; min-height: 0; border-radius: 20px; overflow: hidden; background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px var(--line); }
  .s6-stage .sky { position: absolute; inset: 0; margin: 0; } .s6-stage .sweep { top: 0; bottom: 0; }
  .s6-stage.fade .sky { -webkit-mask-image: radial-gradient(ellipse 80% 90% at 50% 50%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 80% 90% at 50% 50%, #000 55%, transparent 100%); }
  .scan6 .live { margin-top: 0; }


  /* ===== Rodada 8: tela final ===== */
  .f1-grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; flex: 1; min-height: 0; }
  .f1-hero { display: grid; gap: 18px; align-content: center; padding: 24px; border-radius: 24px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px var(--line); }
  .f1-hero .bigres { font-size: 60px; } .f1-hero .res-stats { gap: 18px; justify-content: space-between; } .f1-hero .res-stats div { text-align: left; }
  .f1-sky { display: flex; min-height: 0; } .f1-sky .sky { flex: 1; margin: 0; }
  .scorebars { display: grid; gap: 8px; } .scorebars > div { display: grid; grid-template-columns: 52px 1fr 40px; gap: 10px; align-items: center; font-size: 13px; color: var(--mute); } .scorebars b { color: var(--fg); text-align: right; }
  .scorebars .bar { display: block; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; } .scorebars .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #ffb454, #ff6b9a); transition: width calc(1200ms * var(--slow)) var(--ease) 300ms; } .scorebars .bar.before i { background: #8a8794; }
  .f2-top { display: flex; align-items: center; gap: 16px; }
  .f2-wrap { display: grid; grid-template-columns: 1fr 380px; gap: 20px; flex: 1; min-height: 0; }
  .nextcards { display: grid; gap: 12px; align-content: center; }
  .ncard { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px var(--line); } .ncard b { display: block; font-size: 15px; } .ncard span { font-size: 12px; color: var(--mute); line-height: 1.4; } .ncard .tile { width: 40px; height: 40px; border-radius: 12px; } .ncard .tile .i { width: 20px; height: 20px; }
  .ncard [aria-pressed="false"] > .sw { background: rgba(255,255,255,.28); } .ncard button[data-auto] { padding: 4px; }
  .sky.twinkle .st { animation: pop-in calc(420ms * var(--slow)) var(--ease) calc(var(--i) * 2ms * var(--slow)) both, twinkle calc(3200ms * var(--slow)) ease-in-out calc(var(--i) * -90ms) infinite; } @keyframes twinkle { 50% { opacity: .55; } }


  /* ===== Rodada 9: estrelas nunca na frente de texto ===== */
  .stile { z-index: 2; } .st { z-index: 1; } .confetti { z-index: 1; } .hero5 { z-index: 2; }
  #move-label { display: block; max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px ui-monospace, Menlo, monospace; }


  /* ===== Rodada 10: tema gatinhos (paleta do banner dos 11 gatos) ===== */
  .r3.t10 { --fg: #f7f3ea; --mute: rgba(247,243,234,.68); --line: rgba(247,243,234,.2); --accent: #f39c97; --on-accent: #36231a; --solid: #36231a; --on: #86b443; color: var(--fg);
    background: radial-gradient(60% 50% at 100% 0%, rgba(243,156,151,.38), transparent 70%), radial-gradient(70% 45% at 0% 100%, rgba(163,204,75,.28), transparent 70%), linear-gradient(180deg, #0b4f61, #0a4357 55%, #0a3445); }
  .t10 .track i, .t10 .scorebars .bar i { background: linear-gradient(90deg, #f8d6a2, #f39c97); }
  .t10 .ring .p { stroke: #f39c97; } .t10 .tm { border-color: #0a3445; }
  .t10 .tl.done::after, .t10 .stile.done .tl2 b::after, .t10 .rl .i { color: #bfdc5a; }
  .t10 .tl.new { background: rgba(134,180,67,.2); } .t10 .tl.rm { background: rgba(229,127,143,.2); color: #fcd3d1; }
  .t10 .badge { background: linear-gradient(145deg, #bfdc5a, #86b443); box-shadow: 0 20px 40px rgba(134,180,67,.4), inset 0 1px 0 rgba(255,255,255,.45); }
  .t10 .stile.trash { background: linear-gradient(145deg, rgba(229,127,143,.22), rgba(207,98,115,.08)); border-color: rgba(243,156,151,.45); }
  .t10 .sky.twinkle .st { animation-name: pop-in, twinkle; }

  /* estrelas viram cabecinhas de gato */
  .t10 .st { --k: 1; width: calc(9px * var(--k)); height: calc(8px * var(--k)); margin: calc(-4px * var(--k)) 0 0 calc(-4.5px * var(--k)); border-radius: 50% 50% 46% 46%; background: var(--c); box-shadow: none; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--c) 55%, transparent)); }
  .t10 .st::before, .t10 .st::after { content: ""; position: absolute; top: calc(-2.5px * var(--k)); border-left: calc(2.5px * var(--k)) solid transparent; border-right: calc(2.5px * var(--k)) solid transparent; border-bottom: calc(4px * var(--k)) solid var(--c); }
  .t10 .st::before { left: -.5px; transform: rotate(-10deg); } .t10 .st::after { right: -.5px; transform: rotate(10deg); }
  .t10 .st.dup { box-shadow: none; filter: drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff); }
  .t10 .st.cor { --c: #d9485a !important; box-shadow: none; filter: drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff); }
  .t10 .st.gone { --c: #8d929c !important; filter: none; box-shadow: none; }

<style>
  .pv-dock {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 2147483647;
    display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: calc(100vw - 32px);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
    -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
    transition: opacity 300ms ease-out; pointer-events: none;
  }
  .pv-bar, .pv-handle, .pv-dock[data-info="on"] .pv-card { pointer-events: auto; }
  .pv-dock[data-position="top"] { bottom: auto; top: 20px; flex-direction: column-reverse; }
  .pv-dock[data-dim] { opacity: .3; }
  .pv-dock[data-dim]:hover { opacity: 1; }
  .pv-dock[data-view="hidden"] { left: auto; right: 16px; bottom: 16px; transform: none; }
  .pv-dock[data-view="hidden"][data-position="top"] { top: 16px; }
  .pv-dock[data-view="hidden"] .pv-card, .pv-dock[data-view="hidden"] .pv-bar, .pv-dock:not([data-view="hidden"]) .pv-handle { display: none; }
  .pv-handle {
    width: 36px; height: 36px; padding: 0; border: 0; border-radius: 10px; background: #fff; color: #0c0c0e;
    font: inherit; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; opacity: .55; transition: opacity 150ms ease-out;
  }
  .pv-handle:hover, .pv-handle:focus-visible { opacity: 1; }
  .pv-glass {
    background: rgba(12, 12, 14, .86);
    -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 12px 32px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.14);
  }

  .pv-card {
    box-sizing: border-box; width: min(520px, calc(100vw - 32px)); padding: 16px; border-radius: 16px;
    transform-origin: bottom center;
    transition: opacity 200ms cubic-bezier(.23, 1, .32, 1), transform 200ms cubic-bezier(.23, 1, .32, 1);
  }
  .pv-dock[data-position="top"] .pv-card { transform-origin: top center; }
  .pv-dock[data-info="off"] .pv-card { opacity: 0; transform: translateY(8px) scale(.98); pointer-events: none; transition-duration: 150ms; }
  .pv-dock[data-position="top"][data-info="off"] .pv-card { transform: translateY(-8px) scale(.98); }
  .pv-card-head { display: flex; align-items: center; gap: 12px; }
  .pv-number {
    flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
    background: #fff; color: #0c0c0e; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .pv-title { font-size: 15px; font-weight: 600; }

  .pv-n {

  @media (max-width: 640px) { .pv-name { display: none; } .pv-btn { padding: 0 6px; } }
  @media (prefers-reduced-motion: reduce) { .pv-dock, .pv-dock[data-ready] .pv-highlight, .pv-card, .pv-handle { transition: none; } }
  /* No aplicativo real o harness de prévia não aparece: mantemos só a janela do design. */
  .pv-dock { display: none !important; }
  /* A janela é frameless: o conteúdo preenche tudo, sem fundo externo. */
  html, body { width: 100%; height: 100%; overflow: hidden; }

  .app-titlebar .tb-controls { -webkit-app-region: no-drag; app-region: no-drag; display: flex; align-items: center; gap: 2px; }
  .app-titlebar button { -webkit-app-region: no-drag; app-region: no-drag; width: 40px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: #dfeae6; background: transparent; cursor: pointer; transition: background 120ms ease-out; }
  .app-titlebar button:hover { background: rgba(255,255,255,.12); }
  .app-titlebar button.tb-close:hover { background: #c8423f; color: #fff; }
  .app-titlebar button svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  body:not(.native-window) .app-titlebar { display: none; }
</style>

<body>
<main id="pv-stage"></main>
<div id="pv-dock" class="pv-dock" data-info="off" data-view="full"></div>

<script>
const PREVIEW_TITLE = 'MeOwganiza';
const OPTIONS = { position: 'top', theme: false, slowMotion: true };

/* ---------- dados fictícios ---------- */
const ICON_PATHS = {
  folder: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  image: 'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9.5h.01',
  doc: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6',
  video: 'M3 6h12v12H3zM15 10l6-3v10l-6-3',
  download: 'M12 4v11M7 11l5 5 5-5M5 20h14',
  copy: 'M8 8h12v12H8zM4 16V4h12',
  sparkle: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z',
  trash: 'M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13',
  check: 'M5 12l5 5 9-10',
  box: 'M4 8h16v12H4zM3 4h18v4H3zM10 12h4',
  sheet: 'M4 4h16v16H4zM4 10h16M4 15h16M10 4v16',
  music: 'M9 18V6l10-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM19 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',
  archive: 'M4 4h16v5H4zM5 9v11h14V9M10 13h4',
  file: 'M7 3h7l5 5v13H7zM14 3v5h5',
  alert: 'M12 4l9 16H3zM12 10v4M12 17h.01',
  arrow: 'M5 12h14M13 6l6 6-6 6',
  rules: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4',
  undo: 'M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3',
  back: 'M15 6l-6 6 6 6',
};
const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON_PATHS[name]}"/></svg>`;
const tile = (name, a, b) => `<span class="tile" style="--a:${a};--b:${b}">${icon(name)}</span>`;
const number = new Intl.NumberFormat('pt-BR');

function seeded(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const CATEGORIES = [
  { id: 'img', name: 'Imagens', icon: 'image', a: '#f2b36b', b: '#e8913a', count: 128, avgMb: 4.2, dest: 'Imagens / Fotos e capturas' },
  { id: 'doc', name: 'Documentos', icon: 'doc', a: '#c3d4e2', b: '#7fa4c1', count: 74, avgMb: 1.6, dest: 'Documentos / Recebidos' },
  { id: 'vid', name: 'Vídeos', icon: 'video', a: '#f2a7b5', b: '#e57f8f', count: 16, avgMb: 640, dest: 'Vídeos / Cursos' },
  { id: 'aud', name: 'Áudio', icon: 'music', a: '#7cc3c3', b: '#2f8a9c', count: 31, avgMb: 7.5, dest: 'Música / Soltos' },
  { id: 'zip', name: 'Compactados', icon: 'archive', a: '#f8d6a2', b: '#d7bb94', count: 22, avgMb: 85, dest: 'Arquivos / Compactados' },
  { id: 'app', name: 'Instaladores', icon: 'box', a: '#c08a62', b: '#9a6a44', count: 14, avgMb: 190, dest: 'Instaladores / Antigos' },
  { id: 'xls', name: 'Planilhas', icon: 'sheet', a: '#bfdc5a', b: '#86b443', count: 29, avgMb: 1.1, dest: 'Trabalho / Planilhas' },
  { id: 'oth', name: 'Outros', icon: 'file', a: '#f6f2ea', b: '#a7b0ba', count: 26, avgMb: 12, dest: 'Outros / Sem tipo' },
];
const NAMES = {
  img: { stems: ['IMG_', 'Captura de Tela ', 'foto-viagem-', 'banner-', 'screenshot-'], ext: ['heic', 'png', 'jpg'] },
  doc: { stems: ['Contrato_', 'Proposta_', 'Nota_fiscal_', 'Ata_reuniao_', 'Relatorio_'], ext: ['pdf', 'docx'] },
  vid: { stems: ['aula-', 'gravacao-', 'tutorial-', 'webinar-'], ext: ['mp4', 'mov'] },
  aud: { stems: ['audio-', 'memo-', 'faixa-', 'podcast-'], ext: ['mp3', 'm4a'] },
  zip: { stems: ['backup-', 'projeto-', 'fotos-', 'arquivos-'], ext: ['zip', 'rar'] },
  app: { stems: ['Instalador_', 'Setup_', 'Editor_', 'Navegador_'], ext: ['dmg', 'pkg'] },
  xls: { stems: ['Planilha_', 'Orcamento_', 'Fluxo_caixa_', 'Q3_'], ext: ['xlsx', 'csv'] },
  oth: { stems: ['arquivo-', 'dados-', 'export-', 'sem-nome-'], ext: ['dat', 'bin', 'json'] },
};

const random = seeded(7);
const FILES = [];
CATEGORIES.forEach((category) => {
  const { stems, ext } = NAMES[category.id];
  for (let i = 0; i < category.count; i++) {
    const roll = random();
    const status = category.id === 'app' ? 'ok' : roll < 0.11 ? 'dup' : roll > 0.975 ? 'corrupt' : 'ok';
    const stem = stems[Math.floor(random() * stems.length)] + (1000 + Math.floor(random() * 8999));
    const name = `${stem}${status === 'dup' ? ' (1)' : ''}.${ext[Math.floor(random() * ext.length)]}`;
    const mb = category.avgMb * (0.25 + random() * 1.5) * (status === 'corrupt' ? 0.3 : 1);
    FILES.push({ id: FILES.length, cat: category.id, name, mb, status, sx: 5 + random() * 90, sy: 8 + random() * 78, age: Math.floor(Math.pow(random(), 2.2) * 500 + (category.id === 'app' ? 90 : 0)) });
  }
});
const SCAN_ORDER = FILES.map((file) => [random(), file]).sort((x, y) => x[0] - y[0]).map(([, file]) => file);
const categoryById = (id) => CATEGORIES.find((category) => category.id === id);

const STATS = {};
CATEGORIES.forEach((category) => { STATS[category.id] = { count: 0, mb: 0, dupN: 0, dupMb: 0, corN: 0, corMb: 0 }; });
FILES.forEach((file) => {
  const stats = STATS[file.cat];
  stats.count++; stats.mb += file.mb;
  if (file.status === 'dup') { stats.dupN++; stats.dupMb += file.mb; }
  if (file.status === 'corrupt') { stats.corN++; stats.corMb += file.mb; }
});
const sumStats = (key) => CATEGORIES.reduce((total, category) => total + STATS[category.id][key], 0);
const TOTAL = { n: FILES.length, mb: sumStats('mb'), dupN: sumStats('dupN'), dupMb: sumStats('dupMb'), corN: sumStats('corN'), corMb: sumStats('corMb') };

function fmtMb(mb) {
  if (mb >= 1024) return `${(mb / 1024).toFixed(1).replace('.', ',')} GB`;
  return `${number.format(Math.round(mb))} MB`;
}
const weight = (mb) => Math.pow(Math.max(mb, 0.5), 0.55);

/* ---------- estado e resumo ---------- */
const FOLDERS = [
  { id: 'Downloads', icon: 'download', a: '#7cc3c3', b: '#2f8a9c', hint: 'A mais bagunçada' },
  { id: 'Desktop', icon: 'folder', a: '#f2a7b5', b: '#e57f8f', hint: 'Analisar para ver' },
  { id: 'Documentos', icon: 'doc', a: '#c3d4e2', b: '#7fa4c1', hint: 'Analisar para ver' },
  { id: 'Fotos', icon: 'image', a: '#f2b36b', b: '#e8913a', hint: 'Analisar para ver' },
];
const OPTION_DEFS = [
  { id: 'dups', icon: 'copy', a: '#f8d6a2', b: '#d7bb94', title: 'Excluir duplicados', detail: () => `${TOTAL.dupN} arquivos · ${fmtMb(TOTAL.dupMb)} · mantém o mais antigo` },
  { id: 'corrupt', icon: 'alert', a: '#f39c97', b: '#cf6273', title: 'Excluir corrompidos', detail: () => `${TOTAL.corN} arquivos que não abrem` },
  { id: 'app', icon: 'box', a: '#c08a62', b: '#9a6a44', title: 'Manter instaladores', detail: () => `${STATS.app.count} arquivos .dmg e .pkg · ${fmtMb(STATS.app.mb)} mantidos` },
  { id: 'sort', icon: 'folder', a: '#7cc3c3', b: '#2f8a9c', title: 'Organizar em pastas', detail: () => `${summary().folders} pastas por tipo de arquivo` },
];
const STEP_NAMES = ['pick', 'scan', 'map', 'preview', 'apply', 'done'];
const STEP_LABELS = ['Pasta', 'Análise', 'Mapa', 'Prévia', 'Aplicar'];

let state;
let flowToken = 0;
const variant = () => VARIANTS[current];

function resetState() {
  flowToken++;
  state = { customFolders: [], keep: new Set(), by: 'type', litOrder: null, step: 0, folder: 'Downloads', opts: { dups: true, corrupt: true, app: true, sort: true }, skip: new Set(), drill: null, filter: 'all', tab: 'map', sel: null, mode: 'before', undone: false, lit: 0 };
}

function optionRemoves(id) {
  return id === 'app' ? !state.opts.app : state.opts[id];
}

function isRemoved(file) {
  if (state.keep.has(file.id)) return false;
  const { opts } = state;
  return (file.status === 'dup' && opts.dups) || (file.status === 'corrupt' && opts.corrupt) || (file.cat === 'app' && optionRemoves('app'));
}

function remaining(category) {
  let n = 0; let mb = 0;
  FILES.forEach((file) => { if (file.cat === category.id && !isRemoved(file)) { n++; mb += file.mb; } });
  return { n, mb };
}

function summary() {
  let keptN = 0; let keptMb = 0; let movedN = 0; let folders = 0;
  CATEGORIES.forEach((category) => {
    const left = remaining(category);
    keptN += left.n; keptMb += left.mb;
    if (state.opts.sort && left.n > 0 && !state.skip.has(category.id)) { movedN += left.n; folders++; }
  });
  return { removedN: TOTAL.n - keptN, freedMb: TOTAL.mb - keptMb, movedN, folders, keptN };
}

/* ---------- peças compartilhadas ---------- */
function stepper(step) {
  const shown = step >= 5 ? 5 : step;
  return STEP_LABELS.map((label, index) => {
    const done = step >= 5 || index < shown;
    const attrs = index === shown && step < 5 ? 'aria-current="step"' : done ? 'data-state="done"' : '';
    return `<li ${attrs}><button type="button" class="stepbtn" data-step="${index}" aria-label="Ir para ${label}"><span class="dot">${done ? icon('check') : index + 1}</span>${label}</button></li>`;
  }).join('');
}

function shell(cls, side = '') {
  return `<div class="win r2 ${cls}">${side}<div class="r2-col"><header class="r2-top"><ol class="stepper" id="stepper">${stepper(0)}</ol></header><section class="r2-flow enter" id="flow">${viewFor(0)}</section></div></div>`;
}

function viewFor(step) {
  const name = STEP_NAMES[step];
  return (variant().views?.[name] || DEFAULT_VIEWS[name])();
}

function go(step) {
  state.step = step;
  flowToken++;
  if (step < 5) state.undone = false;
  if (step === 2 || step === 3) state.mode = 'before';
  const flow = document.getElementById('flow');
  flow.innerHTML = viewFor(step);
  flow.classList.remove('enter');
  void flow.offsetWidth;
  flow.classList.add('enter');
  document.getElementById('stepper').innerHTML = stepper(step);
  if (step === 1) startScan();
  if (step === 4) startApply();
  if (step === 5) startCountUp();
  variant().mount?.(STEP_NAMES[step]);
  refreshSummary();
}

function guardedTimer(intervalMs, tick) {
  const token = flowToken;
  const timer = setInterval(() => {
    if (token !== flowToken || !document.getElementById('flow')) return clearInterval(timer);
    if (tick() === false) clearInterval(timer);
  }, intervalMs);
}
function later(ms, action) {
  const token = flowToken;
  setTimeout(() => { if (token === flowToken) action(); }, ms);
}

function refreshSummary() {
  const s = summary();
  const values = { freed: fmtMb(s.freedMb), removed: number.format(s.removedN), moved: number.format(s.movedN), folders: String(s.folders) };
  document.querySelectorAll('[data-sum]').forEach((node) => { node.textContent = values[node.dataset.sum]; });
  document.querySelectorAll('[data-need-work]').forEach((node) => { node.disabled = s.removedN + s.movedN === 0; });
  document.querySelectorAll('[data-opt-detail="sort"]').forEach((node) => { node.textContent = OPTION_DEFS[3].detail(); });
}

function optionRows() {
  return `<div class="opts">${OPTION_DEFS.map((def) => `<button class="opt" data-opt="${def.id}" aria-pressed="${state.opts[def.id]}">${tile(def.icon, def.a, def.b)}<div class="txt"><b>${def.title}</b><span ${def.id === 'sort' ? 'data-opt-detail="sort"' : ''}>${def.detail()}</span></div><span class="sw"></span></button>`).join('')}</div>`;
}
const summaryLines = () => `<div class="sumline"><span>Libera</span><b data-sum="freed"></b></div><div class="sumline"><span>Organiza</span><b><span data-sum="moved"></span> arquivos</b></div>`;
const segControl = () => `<div class="seg" role="group" aria-label="Antes e depois"><button data-mode="before" aria-pressed="${state.mode === 'before'}">Antes</button><button data-mode="after" aria-pressed="${state.mode === 'after'}">Depois</button></div>`;
const trashNote = 'Tudo que sai vai para a Lixeira e fica lá por 30 dias.';

/* ---------- etapas padrão ---------- */
const DEFAULT_VIEWS = {
  pick() {
    return `<div class="pick"><div class="rise"><h1 class="title">Qual pasta você quer organizar?</h1><p class="muted">Primeiro mostro o mapa e o que vai mudar. Nada some sem você confirmar.</p></div>
      <div class="folders">${FOLDERS.map((folder, index) => `<button class="fcard rise" style="--d:${index + 1}" data-folder="${folder.id}" aria-pressed="${folder.id === state.folder}">${tile(folder.icon, folder.a, folder.b)}<div><b>${folder.id}</b><span>${folder.hint}</span></div></button>`).join('')}
        <button class="fcard drop rise" style="--d:5" data-folder="Projetos" aria-pressed="false"><b>Outra pasta…</b><span>ou arraste uma pasta aqui</span></button></div>
      <button class="cta rise" style="--d:6" data-go="1">Analisar <span data-pick-label></span></button></div>`;
  },
  scan() {
    return `<div class="feed"><div class="rise"><div class="muted">Farejando ${state.folder}</div><div class="bignum" data-scan="pct">0%</div></div>
      <div class="track"><i data-scan="bar"></i></div><div class="filenow" data-scan="file">Abrindo a pasta…</div>${liveCounters()}</div>`;
  },
  apply() {
    const tasks = buildTasks();
    return `<div class="apply"><div class="rise"><div class="muted">Aplicando em ${state.folder}</div><h1 class="title" data-apply="pct">0%</h1></div>${tasksHtml(tasks)}<p class="muted note">${trashNote}</p></div>`;
  },
  done() { return doneView(); },
};

const liveCounters = () => `<div class="live"><div><b data-scan="read">0</b><span>arquivos lidos</span></div><div><b data-scan="dups">0</b><span>duplicados</span></div><div><b data-scan="corrupt">0</b><span>corrompidos</span></div></div>`;

function ringScanView() {
  return `<div class="ringwrap"><div class="rise"><h1 class="title">Farejando ${state.folder}</h1><div class="filenow" data-scan="file" style="max-width:420px;margin:0 auto">Abrindo a pasta…</div></div>
    <div class="ring"><svg viewBox="0 0 248 248"><circle class="t" cx="124" cy="124" r="110"/><circle class="p" data-scan="ring" cx="124" cy="124" r="110"/></svg><div class="num"><span data-scan="pct">0%</span><small>lendo arquivos</small></div></div>${liveCounters()}</div>`;
}

function buildTasks() {
  const { opts } = state;
  const s = summary();
  const tasks = [];
  if (opts.dups && TOTAL.dupN) tasks.push({ icon: 'copy', a: '#f8d6a2', b: '#d7bb94', label: `Enviando ${TOTAL.dupN} duplicados para a Lixeira` });
  if (opts.corrupt && TOTAL.corN) tasks.push({ icon: 'alert', a: '#f39c97', b: '#cf6273', label: `Isolando ${TOTAL.corN} arquivos corrompidos` });
  if (optionRemoves('app')) tasks.push({ icon: 'box', a: '#c08a62', b: '#9a6a44', label: `Removendo ${STATS.app.count} instaladores antigos` });
  if (opts.sort) {
    tasks.push({ icon: 'folder', a: '#7cc3c3', b: '#2f8a9c', label: `Criando ${s.folders} pastas` });
    tasks.push({ icon: 'sparkle', a: '#f2a7b5', b: '#e57f8f', label: `Movendo ${number.format(s.movedN)} arquivos` });
  }
  return tasks;
}
const tasksHtml = (tasks) => `<div class="tasks">${tasks.map((task) => `<div class="task" data-task data-state="wait">${tile(task.icon, task.a, task.b)}<b>${task.label}</b><span class="tick">${icon('check')}</span><div class="mini"><i></i></div></div>`).join('')}</div>`;

function doneView() {
  const s = summary();
  if (state.undone) {
    return `<div class="done2"><div class="badge" style="--a1:#f2a7b5;--b1:#e57f8f">${icon('undo')}</div><div><h1 class="title">Tudo voltou ao lugar</h1><p class="muted" style="margin:0">Restaurei ${s.removedN} arquivos e desfiz ${number.format(s.movedN)} movimentos.</p></div><div class="row"><button class="cta" data-go="3">Rever a prévia</button><button class="ghost" data-go="0">Escolher outra pasta</button></div></div>`;
  }
  return `<div class="done2"><div class="badge">${icon('check')}</div>

/* ---------- motores de animação ---------- */
function scanTick(percent) {
  const set = (key, apply) => document.querySelectorAll(`[data-scan="${key}"]`).forEach(apply);
  const read = Math.floor(percent / 100 * FILES.length);
  set('pct', (node) => { node.textContent = `${Math.floor(percent)}%`; });
  set('bar', (node) => { node.style.width = `${percent}%`; });
  set('ring', (node) => { node.style.strokeDashoffset = 691 - 691 * percent / 100; });
  set('file', (node) => { node.textContent = `${state.folder}/${SCAN_ORDER[Math.min(read, FILES.length - 1)].name}`; });
  set('read', (node) => { node.textContent = number.format(read); });
  set('dups', (node) => { node.textContent = Math.floor(TOTAL.dupN * percent / 100); });
  set('corrupt', (node) => { node.textContent = Math.floor(TOTAL.corN * percent / 100); });
  set('sweep', (node) => { node.style.left = `${percent}%`; });
  set('feed', (node) => { node.innerHTML = SCAN_ORDER.slice(Math.max(0, read - 5), read).reverse().map((file, index) => `<div class="fl" style="opacity:${1 - index * 0.2}">${file.name}</div>`).join(''); });
  set('stack', (node) => {
    const counts = {};
    SCAN_ORDER.slice(0, read).forEach((file) => { counts[file.cat] = (counts[file.cat] || 0) + 1; });
    [...node.children].forEach((child, index) => { child.style.width = `${(counts[CATEGORIES[index].id] || 0) / FILES.length * 100}%`; });
  });
  const dots = document.querySelectorAll('[data-pt]');
  for (; state.lit < Math.min(read, dots.length); state.lit++) dots[(state.litOrder || SCAN_ORDER)[state.lit].id].classList.remove('dim');
  variant().onScanTick?.(percent, read);
}

function startScan() {
  let percent = 0;
  state.lit = 0;
  guardedTimer(45, () => {
    percent = Math.min(100, percent + 1.6);
    scanTick(percent);
    if (percent < 100) return true;
    later(700, () => go(2));
    return false;
  });
}

function startApply() {
  const count = Math.max(1, buildTasks().length);
  let percent = 0;
  variant().onApplyStart?.();
  guardedTimer(45, () => {
    percent = Math.min(100, percent + 1.2);
    const slice = 100 / count;
    document.querySelectorAll('[data-task]').forEach((node, index) => {
      const local = Math.max(0, Math.min(100, (percent - index * slice) / slice * 100));
      node.querySelector('.mini i').style.width = `${local}%`;
      node.dataset.state = local >= 100 ? 'done' : local > 0 ? 'run' : 'wait';
    });
    document.querySelectorAll('[data-apply="pct"]').forEach((node) => { node.textContent = `${Math.floor(percent)}%`; });
    if (percent < 100) return true;
    later(800, () => go(5));
    return false;
  });
}

function startCountUp() {
  let progress = 0;
  guardedTimer(30, () => {
    progress = Math.min(1, progress + 0.045);
    const eased = 1 - Math.pow(1 - progress, 3);
    document.querySelectorAll('[data-count]').forEach((node) => {
      const from = Number(node.dataset.from || 0);
      const value = from + (Number(node.dataset.to) - from) * eased;
      node.textContent = node.dataset.fmt === 'mb' ? fmtMb(value) : node.dataset.fmt === 'pct' ? `${Math.round(value)}%` : number.format(Math.round(value));
    });
    return progress < 1;
  });
}

/* ---------- geometria dos mapas ---------- */
function treemapLayout(items, x, y, w, h, ratio) {
  if (items.length === 1) return [{ item: items[0], x, y, w, h }];
  const total = items.reduce((sum, item) => sum + item.weight, 0);
  let acc = 0; let split = 0;
  while (split < items.length - 1 && (split === 0 || acc + items[split].weight / 2 < total / 2)) { acc += items[split].weight; split++; }
  const share = acc / total;
  const first = items.slice(0, split); const second = items.slice(split);
  if (w * ratio >= h) return [...treemapLayout(first, x, y, w * share, h, ratio), ...treemapLayout(second, x + w * share, y, w * (1 - share), h, ratio)];
  return [...treemapLayout(first, x, y, w, h * share, ratio), ...treemapLayout(second, x, y + h * share, w, h * (1 - share), ratio)];
}

function packBubbles(items) {
  const circles = items.map((item, index) => ({ item, r: Math.sqrt(item.weight), x: Math.cos(index * 2.4) * index * 5, y: Math.sin(index * 2.4) * index * 5 }));
  for (let pass = 0; pass < 260; pass++) {
    circles.forEach((circle) => { circle.x *= 0.985; circle.y *= 0.985; });
    for (let a = 0; a < circles.length; a++) {
      for (let b = a + 1; b < circles.length; b++) {
        const first = circles[a]; const second = circles[b];
        let dx = second.x - first.x; let dy = second.y - first.y;
        const distance = Math.hypot(dx, dy) || 0.01;
        const gap = first.r + second.r + 0.8;
        if (distance < gap) {
          const push = (gap - distance) / 2; dx /= distance; dy /= distance;
          first.x -= dx * push; first.y -= dy * push; second.x += dx * push; second.y += dy * push;
        }
      }
    }
  }
  const minX = Math.min(...circles.map((c) => c.x - c.r)); const maxX = Math.max(...circles.map((c) => c.x + c.r));
  const minY = Math.min(...circles.map((c) => c.y - c.r)); const maxY = Math.max(...circles.map((c) => c.y + c.r));
  const scale = Math.min(96 / (maxX - minX), 96 / (maxY - minY));
  return circles.map((c) => ({ item: c.item, left: 50 + (c.x - (minX + maxX) / 2) * scale, top: 50 + (c.y - (minY + maxY) / 2) * scale, size: 2 * c.r * scale }));
}

function arcPath(cx, cy, inner, outer, start, end) {
  const point = (radius, angle) => [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)];
  const large = end - start > Math.PI ? 1 : 0;
  const [x0, y0] = point(outer, start); const [x1, y1] = point(outer, end); const [x2, y2] = point(inner, end); const [x3, y3] = point(inner, start);
  return `M${x0} ${y0}A${outer} ${outer} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${inner} ${inner} 0 ${large} 0 ${x3} ${y3}Z`;
}

const categoryItems = () => CATEGORIES.map((category) => ({ id: category.id, name: category.name, mb: STATS[category.id].mb, weight: weight(STATS[category.id].mb), category })).sort((x, y) => y.weight - x.weight);
function drillItems(categoryId) {

const SKY_TOP = 46;
const shortDest = (category) => category.dest;

function skyTiles(mode, aspect, withFiles = false) {
  const files = (list) => list;

    return [{ key: 'mess', label: state.folder, sub: `${FILES.length} arquivos soltos`, x: 0, y: 0, w: 100, h: 100, a: '#8d929c', b: '#455b6d', files: files(FILES) }];

    }));
  }
  const removed = FILES.filter(isRemoved);
  const items = [];
  CATEGORIES.forEach((category) => {
    const left = remaining(category);
    const kept = FILES.filter((file) => file.cat === category.id && !isRemoved(file));
    if (state.opts.sort && left.n > 0) items.push({ key: category.id, label: shortDest(category), sub: `${left.n} arquivos · ${fmtMb(left.mb)}`, weight: weight(left.mb), a: category.a, b: category.b, files: kept });
  });
  if (!state.opts.sort) {
    const kept = FILES.filter((file) => !isRemoved(file));
    if (kept.length) items.push({ key: 'mess', label: state.folder, sub: `${kept.length} arquivos soltos`, weight: weight(kept.reduce((sum, file) => sum + file.mb, 0)), a: '#8d929c', b: '#455b6d', files: kept });
  }

  items.sort((x, y) => y.weight - x.weight);
  return treemapLayout(items, 0, 0, 100, 100, aspect).map(({ item, x, y, w, h }) => ({ ...item, x, y, w, h }));
}

let customTiles = null;

function arrangeStars(tile, box, positions, scatter) {
  const pad = { left: 10, right: 10, top: SKY_TOP, bottom: 10, ...(tile.pad || {}) };
  const origin = { x: tile.x / 100 * box.width, y: tile.y / 100 * box.height, w: tile.w / 100 * box.width, h: tile.h / 100 * box.height };
  const inner = { x: origin.x + pad.left, y: origin.y + pad.top, w: origin.w - pad.left - pad.right, h: origin.h - pad.top - pad.bottom };
  const list = tile.files;
  if (!list.length) return;
  if (inner.w <= 0 || inner.h <= 0) {
    list.forEach((file) => positions.set(file.id, { x: origin.x + origin.w / 2, y: origin.y + origin.h / 2 }));
    return;
  }
  if (scatter) {
    const avoid = avoidRects(box);
    list.forEach((file) => {
      const point = { x: inner.x + (file.sx - 5) / 90 * inner.w, y: inner.y + (file.sy - 8) / 78 * inner.h };
      avoid.forEach((zone) => {
        if (point.x < zone.left || point.x > zone.right || point.y < zone.top || point.y > zone.bottom) return;
        const above = point.y < (zone.top + zone.bottom) / 2 || zone.bottom >= box.height - 4;
        point.y = above ? zone.top - 4 - (file.id % 9) * 5 : zone.bottom + 4 + (file.id % 9) * 5;
        point.y = Math.max(12, Math.min(box.height - 12, point.y));
      });
      positions.set(file.id, point);
    });
    return;
  }
  let size = tile.size || Math.min(15, Math.sqrt(inner.w * inner.h / list.length));
  if (!tile.size) while (size > 5 && Math.ceil(list.length / Math.max(1, Math.floor(inner.w / size))) * size > inner.h) size -= 0.5;
  const cols = Math.max(1, Math.floor(inner.w / size));
  const offset = tile.align === 'left' ? 0 : (inner.w - Math.min(cols, list.length) * size) / 2;
  const catTopOffset = document.querySelector('.t10') ? 6.5 * Math.max(0.62, Math.min(1, size / 10)) : size / 2;
  list.forEach((file, index) => positions.set(file.id, { x: inner.x + offset + (index % cols) * size + size / 2, y: inner.y + Math.floor(index / cols) * size + catTopOffset, s: size }));
}

function syncTiles(container, tiles) {
  const existing = new Map([...container.children].map((node) => [node.dataset.key, node]));
  tiles.forEach((tile) => {
    let node = existing.get(tile.key);
    if (!node) {
      node = document.createElement('div');
      node.className = 'stile';
      node.dataset.key = tile.key;
      container.appendChild(node);
    }
    existing.delete(tile.key);
    node.classList.toggle('trash', tile.cls === 'trash');
    node.style.cssText = `left:${tile.x}%;top:${tile.y}%;width:${tile.w}%;height:${tile.h}%;--a:${tile.a};--b:${tile.b}`;
    const extra = tile.extra ? `<div class="arrive">${tile.extra}</div>` : '';
    node.innerHTML = `<div class="tl2"><b>${tile.label}</b><span>${tile.sub}</span></div>${extra}`;
  });
  existing.forEach((node) => { node.classList.add('out'); setTimeout(() => node.remove(), 450); });
}

function labelTop(tile, box) {
  const width = Math.max(40, tile.w / 100 * box.width - 24);
  const labelLines = Math.ceil((tile.label.length + 4) / Math.max(6, Math.floor(width / 8.4)));
  const subLines = Math.ceil(tile.sub.length / Math.max(6, Math.floor(width / 6.6)));
  return 12 + labelLines * 18 + subLines * 16 + 18;
}

function avoidRects(box) {
  return [...document.querySelectorAll('[data-avoid]')].map((node) => {
    const rect = node.getBoundingClientRect();
    return { top: rect.top - box.top - 18, bottom: rect.bottom - box.top + 18, left: rect.left - box.left - 28, right: rect.right - box.left + 28 };
  });
}

function computeSky(mode, box) {
  const tilesFor = (layoutMode) => (customTiles && customTiles(layoutMode, box)) || skyTiles(layoutMode, box.width / box.height);
  const tiles = tilesFor(mode);
  const peerMode = mode === 'type' ? 'folders' : mode === 'folders' ? 'type' : null;
  const labelTiles = peerMode ? [...tiles, ...tilesFor(peerMode)] : tiles;
  const labelPad = labelTiles.reduce((max, tile) => Math.max(max, tile.pad?.top ?? labelTop(tile, box)), 0);
  tiles.forEach((tile) => { if (!tile.pad || tile.pad.top === undefined) tile.pad = { ...tile.pad, top: labelPad }; });
  const positions = new Map();
  tiles.forEach((tile) => arrangeStars(tile, box, positions, mode === 'mess'));
  return { tiles, positions };
}

function paintStars(sky, positions, mode, only) {
  sky.querySelectorAll('.st').forEach((node) => {
    const file = FILES[Number(node.dataset.st)];
    if (only && !only(file)) return;
    const point = positions.get(file.id);
    if (point) { node.style.transform = `translate(${point.x}px, ${point.y}px)`; node.style.setProperty('--k', Math.max(0.62, Math.min(1, (point.s || 12) / 10))); }
    node.classList.toggle('gone', mode === 'folders' && isRemoved(file));
  });
}

function placeSky(mode, instant = false) {

  if (!sky) return;

  sky.dataset.skymode = mode;
  sky.dataset.phase = mode === 'folders' ? 'after' : 'before';
  const { tiles, positions } = computeSky(mode, box);
  if (sky.dataset.arrive) tiles.forEach((tile) => { if (mode === 'folders' && tile.cls !== 'trash') tile.extra = tile.files.slice(0, 3).map((file) => `<i>${file.name}</i>`).join(''); });
  syncTiles(sky.querySelector('.stiles'), tiles);
  paintStars(sky, positions, mode);
  if (instant) { void sky.offsetWidth; sky.classList.remove('instant'); }
}

const reasons = ['0 bytes', 'cabeçalho inválido', 'download incompleto'];

/* ===== canvas (cortina) ===== */
function drawSky(canvas, mode) {
  const box = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = box.width * ratio; canvas.height = box.height * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  const tiles = skyTiles(mode, box.width / box.height);
  const positions = new Map();
  tiles.forEach((tile) => arrangeStars(tile, box, positions, mode === 'mess'));
  tiles.forEach((tile) => {
    const x = tile.x / 100 * box.width; const y = tile.y / 100 * box.height; const w = tile.w / 100 * box.width; const h = tile.h / 100 * box.height;
    ctx.beginPath(); ctx.roundRect(x + 2, y + 2, w - 4, h - 4, 14);
    ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '600 13px -apple-system, system-ui, sans-serif'; ctx.fillText(tile.label, x + 12, y + 20);
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '12px -apple-system, system-ui, sans-serif'; ctx.fillText(tile.sub, x + 12, y + 35, w - 24);
  });
  FILES.forEach((file) => {
    const point = positions.get(file.id);
    if (!point) return;
    const gone = mode === 'folders' && isRemoved(file);
    ctx.beginPath(); ctx.arc(point.x, point.y, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = gone ? '#8d929c' : file.status === 'corrupt' ? '#d9485a' : categoryById(file.cat).a; ctx.globalAlpha = gone ? 0.5 : 1; ctx.fill(); ctx.globalAlpha = 1;
    if (file.status === 'dup' && !gone) { ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.2; ctx.stroke(); }
  });
}

/* ===== sankey (triagem) ===== */
function sankeySvg() {
  const W = 1000; const H = 400; const gap = 8; const x0 = 170; const x1 = 800; const barW = 14;
  const left = CATEGORIES.map((category) => ({ category, weight: weight(STATS[category.id].mb) }));
  const rightItems = CATEGORIES.map((category) => ({ category, left: remaining(category) })).filter((entry) => entry.left.n > 0 && state.opts.sort).map((entry) => ({ ...entry, weight: weight(entry.left.mb) }));
  const removedMb = TOTAL.mb - CATEGORIES.reduce((sum, category) => sum + remaining(category).mb, 0);
  const trashWeight = removedMb > 0 ? weight(removedMb) : 0;
  const stack = (items, extra) => {
    const total = items.reduce((sum, item) => sum + item.weight, 0) + extra;
    const scale = (H - gap * items.length) / total; let y = 0;
    return { positions: items.map((item) => { const h = item.weight * scale; const out = { y, h }; y += h + gap; return out; }), scale, end: y };
  };
  const leftStack = stack(left, 0);
  const rightStack = stack(rightItems, trashWeight);
  const ribbons = []; const labels = [];
  left.forEach((entry, index) => {
    const source = leftStack.positions[index]; const stats = STATS[entry.category.id]; const left2 = remaining(entry.category);
    const keptShare = stats.mb ? left2.mb / stats.mb : 0;
    const keptH = source.h * keptShare;
    const targetIndex = rightItems.findIndex((item) => item.category.id === entry.category.id);
    if (targetIndex >= 0 && keptH > 0.5) ribbons.push(ribbon(x0 + barW, source.y, keptH, x1, rightStack.positions[targetIndex].y, rightStack.positions[targetIndex].h, entry.category.b, ribbons.length));
    if (keptShare < 0.999 && trashWeight > 0) ribbons.push(ribbon(x0 + barW, source.y + keptH, source.h - keptH, x1, rightStack.end, trashWeight * rightStack.scale, '#d9485a', ribbons.length));
    labels.push(`<rect x="${x0}" y="${source.y}" width="${barW}" height="${source.h}" rx="4" fill="${entry.category.b}"/><text x="${x0 - 10}" y="${source.y + source.h / 2 + 4}" text-anchor="end">${entry.category.name}</text>`);
  });
  rightItems.forEach((entry, index) => { const pos = rightStack.positions[index]; labels.push(`<rect x="${x1}" y="${pos.y}" width="${barW}" height="${pos.h}" rx="4" fill="${entry.category.b}"/><text x="${x1 + barW + 10}" y="${pos.y + pos.h / 2 + 4}">${entry.category.dest} · ${entry.left.n}</text>`); });
  if (trashWeight > 0) labels.push(`<rect x="${x1}" y="${rightStack.end}" width="${barW}" height="${trashWeight * rightStack.scale}" rx="4" fill="#d9485a"/><text x="${x1 + barW + 10}" y="${rightStack.end + trashWeight * rightStack.scale / 2 + 4}" fill="#ffb3b3">Lixeira · ${TOTAL.n - summary().keptN}</text>`);
  return `<svg class="sankey" viewBox="0 0 ${W} ${H + 20}" role="img" aria-label="Fluxo dos arquivos para as pastas novas">${ribbons.join('')}${labels.join('')}</svg>`;
}
function ribbon(xa, ya, ha, xb, yb, hb, color, index) {
  const mid = (xa + xb) / 2;
  return `<path class="rb" style="--d:${index}" fill="${color}" d="M${xa} ${ya}C${mid} ${ya} ${mid} ${yb} ${xb} ${yb}L${xb} ${yb + hb}C${mid} ${yb + hb} ${mid} ${ya + ha} ${xa} ${ya + ha}Z"/>`;
}

/* movimentos da organização */
function buildMoves() {
  const moves = [];
  const trashMoves = TRASH_ROWS.filter(([key]) => optionRemoves(key)).map(([key, , label]) => ({ rowKey: key, tileKey: 'trash', label: `Lixeira (${label.toLowerCase()})`, files: FILES.filter((file) => isRemoved(file) && (key === 'dups' ? file.status === 'dup' : key === 'corrupt' ? file.status === 'corrupt' : file.cat === 'app' && file.status === 'ok')) })).filter((move) => move.files.length);
  if (trashMoves.length) trashMoves[trashMoves.length - 1].also = 'trash';
  moves.push(...trashMoves);
  if (state.opts.sort) CATEGORIES.forEach((category) => { const files = FILES.filter((file) => file.cat === category.id && !isRemoved(file)); if (files.length) moves.push({ rowKey: category.id, tileKey: category.id, label: category.dest, files }); });
  return moves;
}

function runMoves() {
  const sky = document.getElementById('sky');
  const moves = buildMoves();
  if (!sky || !moves.length) return;
  const { tiles, positions } = computeSky('folders', sky.getBoundingClientRect());
  syncTiles(sky.querySelector('.stiles'), tiles);
  sky.dataset.phase = 'after';
  let index = 0;
  guardedTimer(300, () => {
    if (index >= moves.length) return false;
    const move = moves[index++];
    const ids = new Set(move.files.map((file) => file.id));
    paintStars(sky, positions, 'folders', (file) => ids.has(file.id));
    const bar = document.getElementById('move-bar'); if (bar) bar.style.width = `${index / moves.length * 100}%`;
    const label = document.getElementById('move-label'); if (label) label.textContent = `${move.files[0].name} → ${move.label}${move.files.length > 1 ? ` e mais ${move.files.length - 1}` : ''}`;
    [move.rowKey, move.also].filter(Boolean).forEach((key) => document.querySelectorAll(`[data-row="${key}"]`).forEach((node) => { node.classList.remove('pending'); node.classList.add('done'); }));
    sky.querySelector(`.stile[data-key="${move.tileKey}"]`)?.classList.add('done');
    variant().onMove?.(move);
    return true;
  });
}

function markAllDone() {

function setFocus(key) {

/* ===== B · Lista de estrelas ===== */
function rowTiles(mode, box) {
  if (mode !== 'folders') return null;
  const size = 10;
  const perLine = Math.max(1, Math.floor((box.width - 250 - 24) / size));
  const rows = orderedTiles('folders', box);
  const lines = rows.map((tile) => Math.ceil(tile.files.length / perLine));
  const heights = rows.map((tile, index) => Math.max(38, lines[index] * size + 18));
  const gap = 6;
  const total = heights.reduce((sum, value) => sum + value, 0) + gap * (rows.length - 1);
  const scale = Math.min(1.5, box.height / total);
  let top = 0;
  return rows.map((tile, index) => {
    const height = heights[index] * scale;
    const out = { ...tile, x: 0, w: 100, y: top / box.height * 100, h: height / box.height * 100, size, align: 'left', pad: { left: 250, right: 16, bottom: 0, top: Math.max(4, (height - lines[index] * size) / 2) } };
    top += height + gap * scale;
    return out;
  });
}

  if (!input) return;
  const list = document.getElementById('pal-list');
  let index = 0;
  const paint = () => { list.innerHTML = paletteRows(input.value, index); };
  input.focus({ preventScroll: true });
  input.addEventListener('input', () => { index = 0; paint(); });
  input.addEventListener('keydown', (event) => {
    const rows = list.querySelectorAll('.pal-row');
    if (event.key === 'ArrowDown') { index = Math.min(rows.length - 1, index + 1); paint(); event.preventDefault(); }
    else if (event.key === 'ArrowUp') { index = Math.max(0, index - 1); paint(); event.preventDefault(); }
    else if (event.key === 'Enter' && rows[index]) rows[index].click();
    else if (event.key === 'Escape') { input.value = ''; index = 0; paint(); }
  });
}

function bucketTiles(mode) {
  if (mode !== 'buckets') return null;
  return BUCKETS.map(([key, label, a, b], index) => ({ key, label, sub: '0 arquivos', x: index * 33.4, y: 64, w: 33.2, h: 36, a, b, files: FILES.filter((file) => bucketOf(file) === key) }));
